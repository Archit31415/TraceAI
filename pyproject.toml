[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceai"
version = "0.1.0"
description = "LLM Terminal Debugger"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
traceai = "traceai.cli:main"